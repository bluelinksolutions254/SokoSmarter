<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>My Profile – SOKO Smart</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
.pfs{padding-top:12px}
.pfh{display:flex;gap:12px;align-items:center;background:var(--g);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.pfa{width:42px;height:42px;border-radius:50%;background:var(--o);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;overflow:hidden}.pfa img{width:100%;height:100%;object-fit:cover;display:block}.pfa.big{width:76px;height:76px;font-size:30px;color:#fff}.fpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}.fpg:empty{display:none}.fpg figure{margin:0;display:grid;gap:6px;justify-items:stretch}.fpg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--bd);display:block}.fpg figcaption{font-size:12px;text-align:center}.fpg .btn{width:100%}.pfp{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}.pfp .bt{display:flex;gap:8px;flex-wrap:wrap}.pfp .m{flex-basis:100%;margin:0}
.pfm{min-width:0;display:grid;line-height:1.25}.pfm b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pfm small{opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfq{margin-left:auto;display:flex;gap:6px;flex:none}.pfq .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}.pfq .btn:hover{background:var(--o)}
.tabs{flex-wrap:wrap;overflow:visible;gap:8px;padding-bottom:12px}.tabs button{padding:7px 14px;font-size:14px}
.fm.pc{padding:12px 14px;margin-bottom:10px}
.pig{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px;margin:0}.pig div{min-width:0}.pig dt{color:var(--mut);font-size:12.5px}.pig dd{margin:0;font-weight:700;overflow-wrap:anywhere}
details.fm{padding:0}details.fm>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}details.fm>summary::-webkit-details-marker{display:none}details.fm>summary::after{content:"+";font-size:20px;color:var(--mut)}details.fm[open]>summary::after{content:"\2212"}
details.fm>.in{padding:0 14px 14px;display:grid;gap:12px}
.pig{grid-template-columns:1fr;gap:0}.pig div{padding:10px 0;border-top:1px solid var(--bd)}.pig div:first-child{border-top:0}
#inf .two,details.fm .two{grid-template-columns:1fr}
.bdl{display:flex;gap:10px;align-items:center;margin:2px 0 10px}.bdl .bar{flex:1;height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bdl .bar i{display:block;height:100%;background:var(--o)}
.bdw{display:flex;gap:16px 14px;flex-wrap:wrap}.bdw div{display:grid;justify-items:center;gap:8px;width:110px;text-align:center}
@media(max-width:560px){.pfq .btn{padding:6px 10px;font-size:13px}.pfm small{display:none}}
.trk{display:flex;margin:14px 0 6px;padding:0;list-style:none}.trk li{flex:1;text-align:center;position:relative;font-size:12.5px;color:var(--mut)}
.trk li::before{content:"";display:block;width:24px;height:24px;border-radius:50%;background:var(--bd);margin:0 auto 6px;position:relative;z-index:1;box-sizing:border-box;color:#fff;font-size:13px;line-height:24px;font-weight:800}
.trk li::after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:4px;background:var(--bd);border-radius:2px}.trk li:first-child::after{display:none}
.trk li.done{color:var(--tx);font-weight:700}.trk li.done::before{content:"\2713";background:var(--g)}.trk li.done::after{background:var(--g)}.trk li.now::before{box-shadow:0 0 0 4px rgba(22,163,74,.25)}
.oc{display:grid;gap:8px}.oc .oh{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.oc .oi{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}.oc .oi img,.oc .oi span.ph{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--ot);flex:none}
.oc .ob{display:flex;gap:8px;flex-wrap:wrap}.oc .ox{background:var(--ot);border-radius:10px;padding:8px 10px;font-size:14px}.wlg+.wlg{margin-top:20px}
</style>
</head>
<body>
<div id="hd"></div>
<main><section class="alt pfs"><div class="w" style="max-width:820px"><div id="pf"></div></div></section></main>
<div id="ft"></div>
<script>
shell("profile.html");
const TABS={info:"My Information",orders:"My Orders",jobs:"My Jobs",saved:"Wishlist",free:"Free Things",wallet:"Wallet",freelance:"Freelance",shops:"My Shop",badges:"My Badges"},KINDS=["Giveaway","Charity","Donation","Free to collect"];
const TYPES=["Full-time","Part-time","Contract","Internship","Casual"],MODES=["On-site","Remote","Hybrid"];
let U,tab=TABS[location.hash.slice(1)]?location.hash.slice(1):"info";
const del=(t,id)=>`<button class="btn s d" data-del="${t}" data-id="${esc(id)}">Delete</button>`;
function gate(m,login){$("#pf").innerHTML=`<div class="msg">${m}${login?'<br><br><button class="btn p" id="gl">Login</button> <button class="btn" id="gs">Sign Up</button>':""}</div>`;if(login){$("#gl").onclick=logView;$("#gs").onclick=signView}}
async function init(){if(!sb){gate("Connect Supabase (CFG in soko.js) to use your profile.");return}
 U=await user();if(!U){gate("Please log in first, or create an account, to manage your information, jobs and listings.",1);return}
 try{const a=await sb.from("profiles").select("avatar_url").eq("id",U.id).maybeSingle();if(a.data&&a.data.avatar_url)PROF.avatar_url=a.data.avatar_url}catch(e){}
 draw()}
let PROF={};
const avURL=()=>PROF.avatar_url||(U&&U.user_metadata&&U.user_metadata.avatar_url)||"";
const avHTML=nm=>avURL()?`<img alt="" src="${esc(avURL())}">`:esc(String(nm||"?").charAt(0).toUpperCase());
function head(){const nm=PROF.full_name||U.user_metadata?.full_name||"",shown=nm||dispName(U,24);
 return `<div class="pfh"><span class="pfa">${avHTML(shown)}</span><div class="pfm"><b>${esc(shown)}</b><small title="${esc(U.email)}">${esc(U.email)}</small></div><span class="pfq"><a class="btn s" href="orders.html">Orders</a><a class="btn s" href="#wallet" data-t="wallet">Wallet</a><a class="btn s" href="#freelance" data-t="freelance">Freelance</a><a class="btn s" href="shopmanager.html">Shop Manager</a></span></div>`}
function draw(){if(tab==="orders"){tab="info";history.replaceState(null,"","#info");location.href="orders.html";return}if(tab==="wallet"){tab="info";history.replaceState(null,"","#info");location.href="wallet.html";return}$("#pf").innerHTML=head()+`<div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" class="${k===tab?"on":""}">${v}</button>`).join("")}</div><div id="pn"></div>`;
 ({info:infoTab,jobs:jobsTab,saved:savedTab,orders:ordersTab,free:freeTab,wallet:walletTab,freelance:freelanceTab,shops:shopsTab,badges:badgesTab})[tab]()}
async function listOf(table,box,line){const {data,error}=await sb.from(table).select("*").eq("owner_id",U.id).order("created_at",{ascending:false});
 $(box).innerHTML=error?`<div class="msg">${esc(error.message)}</div>`:(data||[]).map(r=>`<div class="row"><div><strong>${esc(r.title||r.shop_name)}</strong> <span class="pill ${r.status}">${esc(r.status)}</span><div class="m">${esc(line(r))}</div></div>${del(table,r.id)}</div>`).join("")||'<div class="empty">Nothing here yet.</div>'}
async function infoTab(){let r=await sb.from("profiles").select("full_name,phone,county,created_at,avatar_url").eq("id",U.id).maybeSingle();if(r.error)r=await sb.from("profiles").select("full_name,phone,county,created_at").eq("id",U.id).maybeSingle();const p=r.data||{},nm=p.full_name||U.user_metadata?.full_name||"";
 if(p.full_name&&p.full_name!==PROF.full_name){PROF={...PROF,...p};const h=document.querySelector(".pfh");if(h)h.outerHTML=head()}
 const since=new Date(U.created_at).toLocaleDateString("en-KE",{year:"numeric",month:"short",day:"numeric"});
 $("#pn").innerHTML=`<div class="fm pc" id="card"><div class="tb" style="margin:0"><h3 style="margin:0">My information</h3><button class="btn s" id="ed">Edit</button></div>
 <div class="pfp"><span class="pfa big" id="avPrev">${avHTML(nm||dispName(U,24))}</span><div class="bt"><label class="btn s" style="cursor:pointer;margin:0">${avURL()?"Change photo":"Add a profile photo"}<input type="file" id="avf" accept="image/*" hidden></label>${avURL()?'<button class="btn s d" type="button" id="avrm">Remove photo</button>':""}</div><p class="m" id="avMsg">A square photo or logo works best. Shown on your profile and in the header.</p></div>
 <dl class="pig"><div><dt>Name</dt><dd>${esc(nm||"Not set")}</dd></div><div><dt>Email</dt><dd>${esc(U.email)}</dd></div><div><dt>Phone</dt><dd>${esc(p.phone||"Not set")}</dd></div><div><dt>County</dt><dd>${esc(p.county||"Not set")}</dd></div><div><dt>Member since</dt><dd>${esc(since)}</dd></div></dl></div>
 <form class="fm pc" id="inf" hidden><h3 style="margin:0">Edit information</h3><div class="two"><label>Full name<input name="full_name" required value="${esc(nm)}"></label>
 <label>Phone number<input name="phone" type="tel" pattern="(254|0|[+]254)[17][0-9]{8}" value="${esc(p.phone||"")}"></label></div>${sel("County","county",COUNTIES,p.county||"","")}
 <div class="two"><button class="btn p">Save changes</button><button type="button" class="btn" id="cx">Cancel</button></div></form>
 <details class="fm"><summary>Password &amp; account</summary><div class="in">
 <form id="pwd" style="display:grid;gap:10px"><b>Change password</b><div class="two">${fld("New password","pw","password","minlength=8 autocomplete=new-password")}${fld("Confirm new password","pc","password","minlength=8 autocomplete=new-password")}</div><button class="btn p">Update password</button></form>
 <div style="border-top:1px solid var(--bd);padding-top:12px;display:grid;gap:8px"><b style="color:var(--r)">Delete my profile</b><p class="m" style="margin:0">Permanently deletes your account, jobs, free listings and shop applications. Type DELETE to confirm.</p><input id="dcf" placeholder="DELETE" autocomplete="off" style="border:1px solid var(--bd);border-radius:8px;padding:9px 10px;font:inherit;width:100%"><button class="btn d" id="dp">Delete my profile</button></div></div></details>`;
 $("#ed").onclick=()=>{$("#card").hidden=true;$("#inf").hidden=false};$("#cx").onclick=()=>{$("#inf").hidden=true;$("#card").hidden=false}}
const OSTEPS=[["pending","Placed"],["confirmed","Confirmed"],["shipped","Shipped"],["delivered","Delivered"]],
 OMSG={pending:"Waiting for the seller to confirm your order.",confirmed:"The seller confirmed your order and is getting it ready.",shipped:"Your order is on its way to you.",delivered:"Delivered. If everything is fine, release the payment from your wallet.",cancelled:"This order was cancelled."},
 OPAY={held:["Payment held safely by SOKO Smart",""],released:["Seller has been paid","approved"],refunded:["Refunded to your wallet","rejected"]};
let OREC={};
async function ordersTab(quiet){const P=$("#pn");if(quiet!==true)P.innerHTML='<div class="msg">Loading your orders…</div>';
 const r=await sb.from("orders").select("*,order_items(*)").eq("buyer_id",U.id).order("created_at",{ascending:false}).limit(50);
 if(tab!=="orders")return;
 if(r.error){P.innerHTML=`<div class="msg">${esc(r.error.message)}</div>`;return}
 const L=r.data||[];OREC={};L.forEach(o=>OREC[o.id]=o);
 if(!L.length){P.innerHTML='<div class="empty">You have not placed any orders yet.<br><br><a class="btn p" href="shop.html">Start shopping</a></div>';return}
 const sids=[...new Set(L.map(o=>o.shop_id).filter(Boolean).map(String))],pids=[...new Set(L.flatMap(o=>(o.order_items||[]).map(i=>i.product_id)).filter(Boolean).map(String))],SN={},PI={};
 await Promise.all([sids.length?sb.from("shops").select("id,name").in("id",sids).then(x=>(x.data||[]).forEach(z=>SN[String(z.id)]=z.name),()=>{}):0,pids.length?sb.from("products").select("id,cover_url").in("id",pids).then(x=>(x.data||[]).forEach(z=>PI[String(z.id)]=z.cover_url),()=>{}):0]);
 if(tab!=="orders")return;
 const dt=d=>d?new Date(d).toLocaleString("en-KE",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
 const card=o=>{const st=String(o.status||"pending"),cx=st==="cancelled",ix=Math.max(0,OSTEPS.findIndex(x=>x[0]===st)),py=OPAY[o.pay_status],shop=o.shop_id?SN[String(o.shop_id)]:"SOKO Smart",
   items=(o.order_items||[]).map(i=>{const im=PI[String(i.product_id)];return `<a class="oi" href="product.html?s=products&id=${encodeURIComponent(i.product_id)}">${im?`<img alt="" loading="lazy" src="${esc(im)}">`:'<span class="ph"></span>'}<span><b>${esc(i.title||"Item")}</b><br><span class="m">Qty ${esc(i.qty||i.quantity||1)}${i.price!=null?" · "+fmt(i.price):""}</span></span></a>`}).join("");
   return `<div class="fm pc oc"><div class="oh"><div><b>Order #${esc(String(o.id).slice(0,6))}</b><div class="m">${esc(dt(o.created_at))}${shop?" · "+esc(shop):""}</div></div><div style="text-align:right"><b>${fmt(o.total)}</b><div>${cx?'<span class="pill rejected">Cancelled</span>':`<span class="pill ${st==="delivered"?"approved":"pending"}">${esc((OSTEPS.find(x=>x[0]===st)||[0,st])[1])}</span>`}</div></div></div>
   ${cx?"":`<ol class="trk" aria-label="Order progress">${OSTEPS.map((x,k)=>`<li class="${k<=ix?"done":""} ${k===ix?"now":""}">${x[1]}</li>`).join("")}</ol>`}
   <div class="ox">${esc(OMSG[st]||"We are processing your order.")}${py?` <b>${py[0]}.</b>`:""}</div>${items}
   <div class="ob"><button class="btn s" data-oc="${esc(o.id)}">Chat with seller</button>${o.pay_status==="held"?'<a class="btn s p" href="wallet.html">Release payment or report a problem</a>':""}</div></div>`};
 P.innerHTML=`<p class="m" style="margin:0 0 10px">Follow your orders here. The progress updates automatically when the seller changes the status.</p>`+L.map(card).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-oc]");if(!b)return;const o=OREC[b.dataset.oc];if(!o)return;
 if(!o.seller_id){toast("This seller cannot be reached from here yet. Use the chat button at the bottom of the page.");return}
 if(!window.SokoChat){toast("Chat is still loading, please try again");return}
 SokoChat.chatWith(o.seller_id,o.shop_id||null,"Hi, I am asking about my order #"+String(o.id).slice(0,6)+".")});
setInterval(()=>{if(U&&tab==="orders"&&!document.hidden)ordersTab(true)},30000);
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(U&&TABS[h]&&h!==tab){tab=h;draw()}});
async function badgesTab(){$("#pn").innerHTML='<div class="fm pc" id="bdg"><h3 style="margin:0">My badges</h3><p class="m" style="margin:0">Loading…</p></div>';const el=$("#bdg");
 try{if(!window.SokoBadges)throw new Error("badges.js is not loaded. Upload badges.js next to profile.html.");
  try{await sb.rpc("soko_check_my_badges")}catch(e){}
  const r=await sb.from("user_badges").select("featured,awarded_at,badges(id,name,icon,color,tier,points,manual)").eq("user_id",U.id).order("awarded_at",{ascending:false});
  if(r.error)throw new Error(/relation|schema cache|does not exist/i.test(r.error.message)?"Badges are not set up yet. Run supabase-badges.sql in Supabase.":r.error.message);
  const L=(r.data||[]).filter(x=>x.badges).sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)),xp=L.reduce((a,x)=>a+x.badges.points,0),lv=SokoBadges.level(xp);
  el.innerHTML=`<div class="tb" style="margin:0"><h3 style="margin:0">My badges</h3><a class="btn s" href="achievements.html">All achievements</a></div>
  <div style="display:flex;gap:12px;align-items:center">${SokoBadges.coin(lv.index,48)}<div><b>${esc(lv.name)}</b> <span class="m">· ${xp.toLocaleString("en-KE")} XP</span></div></div>
  <div class="bdl"><span class="bar" role="progressbar" aria-valuenow="${lv.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${lv.pct}%"></i></span><span class="m">${lv.next?lv.toNext.toLocaleString("en-KE")+" XP to "+esc(lv.next):"Top level"}</span></div>
  ${L.length?`<div class="bdw">${L.map(x=>`<div>${SokoBadges.medal(x.badges,{size:76,name:1})}</div>`).join("")}</div>`:'<p class="m" style="margin:0">No badges yet. Your first one is on its way: complete your profile and make your first contribution.</p>'}`}
 catch(e){el.innerHTML=`<h3 style="margin:0">My badges</h3><div class="msg">${esc(e.message||String(e))}</div>`}}
async function jobsTab(){const cs=(await sb.from("categories").select("id,name").eq("section","jobs").order("sort_order")).data||[],today=new Date().toISOString().slice(0,10),ck='style="width:auto;display:inline-block"';
 $("#pn").innerHTML=`<div class="tb"><b>Jobs you posted</b><button class="btn p" id="tg">+ Post a job</button></div>
 <form class="fm" id="jb" hidden><p class="m" style="margin:0">Fields marked * are required.</p>
 <div class="two"><label>Job title *<input name="title" required maxlength="120" placeholder="e.g. Digital Marketing Executive"></label><label>Company name *<input name="company" required maxlength="120"></label></div>
 <div class="two"><label>Company logo<input name="logo" type="file" accept="image/*"></label><label>Job category *<select name="category_id" required><option value="">Choose</option>${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label></div>
 <div class="two">${sel("Employment type *","employment_type",TYPES)}${sel("Work arrangement","work_mode",MODES,"","")}</div>
 <div class="two">${sel("Experience level","experience_level",["Entry-level","Mid-level","Senior"],"","")}${sel("County *","county",COUNTIES)}</div>
 <div class="two"><label>Town / city<input name="town"></label><label>Number of vacancies<input name="vacancies" type="number" min="1" value="1"></label></div>
 <div class="two"><label>Minimum salary (KSh)<input name="salary_min" type="number" min="0"></label><label>Maximum salary (KSh)<input name="salary_max" type="number" min="0"></label></div>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="salary_negotiable" ${ck}> Salary is negotiable</label>
 <label>Job description *<textarea name="description" rows="4" required></textarea></label>
 <label>Responsibilities (one per line)<textarea name="responsibilities" rows="4"></textarea></label>
 <label>Requirements (one per line)<textarea name="requirements" rows="4"></textarea></label>
 <label>Application deadline<input name="deadline" type="date" min="${today}"></label>
 <label>How should people apply? *<select name="application_method" required><option value="Easy Apply">Easy Apply on SOKO Smart</option><option value="Email">By email</option><option value="Website">External website link</option></select></label>
 <label id="ae" hidden>Application email *<input name="apply_email" type="email"></label><label id="au" hidden>Application link *<input name="apply_url" type="url" placeholder="https://…"></label>
 <div class="two"><label>Contact person<input name="contact_name"></label><label>Contact phone<input name="contact_phone" type="tel"></label></div>
 <label>Contact email<input name="contact_email" type="email"></label>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="is_urgent" ${ck}> Urgently hiring</label>
 <button class="btn p">Submit job for review</button></form><div id="ls"></div>`;
 $("#tg").onclick=()=>$("#jb").hidden=!$("#jb").hidden;myJobs()}
async function myJobs(){const {data,error}=await sb.from("jobs").select("*,job_applications(count)").eq("owner_id",U.id).order("created_at",{ascending:false}),today=new Date().toISOString().slice(0,10);
 $("#ls").innerHTML=error?`<div class="msg">${esc(error.message)}</div>`:(data||[]).map(r=>{const n=r.job_applications?.[0]?.count||0,ex=r.deadline&&r.deadline<today;
  return `<div class="row"><div><strong>${esc(r.title)}</strong> <span class="pill ${r.status}">${esc(r.status)}</span>${ex?' <span class="pill rejected">Expired</span>':""}${r.is_urgent?' <span class="pill">Urgent</span>':""}<div class="m">${esc([r.reference_no,r.company,r.employment_type,r.county].filter(Boolean).join(" · "))}</div></div><span><button class="btn s" data-apps="${esc(r.id)}">Applications (${n})</button> ${del("jobs",r.id)}</span></div>`}).join("")||'<div class="empty">Nothing here yet.</div>'}
const WLG=[["products","products","Saved products",r=>pcard(r,"products")],["shops","shops","Saved shops",r=>pcard(r,"shops","name")],["services","services","Saved services",r=>pcard(r,"services")],["free","free_listings","Saved free things",r=>pcard(r,"free","title",r.kind||"Free")],["jobs","jobs","Saved jobs",jcard]];
async function savedTab(){$("#pn").innerHTML='<div class="msg">Loading…</div>';
 const f=await sb.from("favorites").select("listing_type,listing_id").eq("user_id",U.id);
 if(f.error){$("#pn").innerHTML=`<div class="msg">${esc(/favorites|schema cache|does not exist|policy/i.test(f.error.message||"")?"Wishlist is not set up yet. Run supabase-favorites.sql in Supabase.":f.error.message)}</div>`;return}
 const all=f.data||[];all.forEach(x=>FAV.add(x.listing_type+":"+x.listing_id));
 const out=await Promise.all(WLG.map(async([ty,tb,title,card])=>{const ids=all.filter(x=>x.listing_type===ty).map(x=>x.listing_id);if(!ids.length)return"";
  try{const r=await sb.from(tb).select("*").in("id",ids).eq("status","approved");const L=r.data||[];if(r.error||!L.length)return"";
   return `<section class="wlg"><h3 style="margin:0 0 10px">${title} (${L.length})</h3><div class="${ty==="jobs"?"jobs":"grid"}">${L.map(card).join("")}</div></section>`}catch(e){return""}}));
 const h=out.join("");
 $("#pn").innerHTML=h||'<div class="empty">Your wishlist is empty. Tap the heart on a product, shop or job to save it.<br><br><a class="btn p" href="shop.html">Browse the shop</a></div>';paintFavs()}
/* un-hearting an item on the wishlist page removes it from the list straight away */
