<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Manager – SOKO Smart</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="soko.css?v=14">
<link rel="stylesheet" href="mobile.css?v=2">
<script defer src="mobile.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.SOKO_NO_ADS=1</script>
<script src="soko.js?v=32"></script>
<script src="shopagency.js?v=1"></script>
<style>
.bar2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar2 label{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--tx);font-size:15px}
.bar2 select{border:2px solid var(--o);border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;background:var(--bg);color:var(--tx);min-width:200px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.st b{display:block;font-size:24px;color:var(--od)}.st span{font-size:13px;color:var(--mut)}
.two2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}@media(max-width:860px){.two2{grid-template-columns:1fr}}
.pan{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}.pan h3{margin:0 0 10px;font-size:16px}
.wrap{background:var(--bg);border:1px solid var(--bd);border-radius:12px;overflow-x:auto;margin-bottom:12px}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:var(--bg2)}
.th{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--ot)}
.bar{height:8px;border-radius:4px;background:var(--o);margin-top:3px}.low{color:var(--r);font-weight:700}
.sm{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;background:var(--bg);color:var(--tx)}.qty{width:90px}
.tabs i{font-style:normal;background:var(--r);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:6px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
.adh{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pill.rv{background:#e8f0fb;color:#1d4f91}.pill.pz{background:#eee;color:#555}
.adst{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}.adst div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px}.adst b{display:block;font-size:20px;color:var(--g)}.adst span{font-size:13px;color:var(--mut)}
.adpb{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:4px;min-width:90px}.adpb i{display:block;height:100%;background:var(--o)}
.adth{width:56px;height:42px;border-radius:8px;object-fit:cover;display:block}
/* tabs wrap, no sideways scrolling */
.tabs{flex-wrap:wrap;overflow:visible;gap:8px;padding-bottom:14px}.tabs button{padding:8px 16px;font-weight:700;cursor:pointer}.tabs button:hover:not(.on){border-color:var(--o);color:var(--od)}
/* forms inside panels look the same as the site forms */
.pan label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--tx)}.pan label .m,.pan .m{font-weight:400}
.pan input:not([type=checkbox]):not([type=radio]),.pan select,.pan textarea{width:100%;box-sizing:border-box;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font:inherit;font-weight:400;background:var(--bg);color:var(--tx)}
.pan input:focus,.pan select:focus,.pan textarea:focus{outline:0;border-color:var(--o);box-shadow:0 0 0 3px rgba(245,142,32,.18)}
.pan input[type=file]{padding:8px;background:var(--bg2)}
/* shop profile */
.spx{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}
.spx-l{display:grid;gap:12px;justify-items:center;text-align:center;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:18px 14px}
.spx-l #spv{width:120px!important;height:120px!important;border-radius:24px!important;font-size:44px!important}
.spx-l b{font-size:16px}.spx-l input[type=file]{font-size:12.5px}
.spx-r{display:grid;gap:16px;min-width:0}
.pan h3.sph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px;font-size:18px}
@media(max-width:760px){.spx{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="hd"></div>
<main><section class="alt"><div class="w"><h2>Shop Manager <a href="profile.html#shops">My profile</a></h2><div id="app"></div></div></section></main>
<div id="ft"></div>
<script>
shell("");
const STS=["pending","confirmed","shipped","delivered","cancelled"],TABS={overview:"Overview",orders:"Orders",products:"Products",stock:"Stock",ads:"Ads",agents:"Agents Manager",profile:"Shop profile",plan:"Subscription",verify:"Verification"};
const K=n=>Number(n||0).toLocaleString("en-KE"),pc=s=>s==="delivered"?"approved":s==="cancelled"?"rejected":"",low=p=>(+p.stock||0)<=(+p.low_stock_at||5);
const sid=o=>String(o.id).slice(0,6),when=d=>new Date(d).toLocaleDateString("en-KE",{day:"numeric",month:"short",year:"numeric"});
let U,SH=[],shop,tab=TABS[location.hash.slice(1)]?location.hash.slice(1):"overview",R=30,OF="",P=[],O=[],L=[],CAT=[],AD=[],ADERR="";
const gate=(m,x="")=>{$("#app").innerHTML=`<div class="msg">${m}${x}</div>`};

/* ----- category forms (defined by admin) ----- */
const fieldsOf=id=>{const c=CAT.find(x=>String(x.id)===String(id));return Array.isArray(c&&c.fields)?c.fields:[]};
let MAINS=[];
async function catQ(){let r=await sb.from("categories").select("id,name,fields,main_id").eq("section","products").order("sort_order");if(r.error)r=await sb.from("categories").select("id,name,fields").eq("section","products").order("sort_order");if(r.error)r=await sb.from("categories").select("id,name").eq("section","products").order("sort_order");try{const m=await sb.from("main_categories").select("id,name").eq("section","products");MAINS=m.data||[]}catch(e){MAINS=[]}return r}
const catOpts=()=>{const o=c=>`<option value="${c.id}">${esc(c.name)}</option>`,g=[];MAINS.forEach(m=>{const l=CAT.filter(c=>String(c.main_id)===String(m.id));if(l.length)g.push(`<optgroup label="${esc(m.name)}">${l.map(o).join("")}</optgroup>`)});return g.join("")+CAT.filter(c=>!MAINS.some(m=>String(m.id)===String(c.main_id))).map(o).join("")};
async function subLoad(f){const w=f.querySelector("#subw"),s=f.querySelector("[name=sub]");if(!w||!s)return;s.innerHTML='<option value="">None</option>';w.hidden=true;if(!f.cat.value)return;try{const r=await sb.from("subcategories").select("id,name").eq("category_id",+f.cat.value).order("sort_order"),a=r.data||[];s.innerHTML='<option value="">None</option>'+a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");w.hidden=!a.length}catch(e){}}
document.addEventListener("change",e=>{const t=e.target;if(t.name==="cat"&&t.form&&t.form.id==="pf")subLoad(t.form)});
function attrHTML(fs,vals={}){return fs.map(f=>{const n="a_"+f.key,v=vals[f.key]??"",rq=f.required?"required":"",L=esc(f.label)+(f.required?" *":"");
 if(f.type==="textarea")return `<label style="grid-column:1/-1">${L}<textarea name="${n}" rows="3" ${rq}>${esc(v)}</textarea></label>`;
 if(f.type==="select"||f.type==="yesno"){const o=f.type==="yesno"?["Yes","No"]:(f.options||[]);return `<label>${L}<select name="${n}" ${rq}><option value="">Choose</option>${o.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`}
 return `<label>${L}<input name="${n}" type="${f.type==="number"?"number":f.type==="date"?"date":"text"}" ${f.type==="number"?'min="0" step="any"':'maxlength="200"'} value="${esc(v)}" ${rq}></label>`}).join("")}
const attrBox=(fs,vals)=>fs.length?`<div style="border-top:1px dashed var(--bd);padding-top:10px"><b>Details for this category</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px">${attrHTML(fs,vals)}</div></div>`:"";
function readAttrs(f,fs){const o={};fs.forEach(x=>{const el=f.elements["a_"+x.key];if(!el)return;const v=el.value.trim();if(v==="")return;o[x.key]=x.type==="number"?+v:v});return o}
const editAttrs=(p,f)=>{const fs=fieldsOf(p.category_id),o={...(p.attributes||{})};fs.forEach(x=>delete o[x.key]);return{...o,...readAttrs(f,fs)}};

async function init(){
 if(!sb)return gate("Connect Supabase (CFG in soko.js) to use the Shop Manager.");
 U=await user();if(!U){gate("Please log in first, or create an account, to manage your shop.",'<br><br><button class="btn p" id="gl">Login</button> <button class="btn" id="gs">Create an account</button>');$("#gl").onclick=logView;$("#gs").onclick=signView;return}
 const r=await sb.from("shops").select("*").eq("owner_id",U.id).order("created_at");
 if(r.error)return gate(esc(r.error.message));SH=r.data||[];
 if(!SH.length)return gate("You don't have a shop yet.",'<br><br><a class="btn p" href="openshop.html">Open a Shop</a>');
 let s="";try{s=localStorage.sokoShop||""}catch(e){}
 shop=SH.find(x=>String(x.id)===s)||SH[0];frame();load()}
function frame(){const pend=O.filter(o=>o.status==="pending").length,lows=P.filter(low).length,bd={orders:pend,stock:lows};
 $("#app").innerHTML=`<div class="bar2"><label>Shop <select id="shopSel" aria-label="Choose shop">${SH.map(s=>`<option value="${esc(s.id)}" ${s.id===shop.id?"selected":""}>${esc(s.name)}${s.status!=="approved"?" ("+esc(s.status)+")":""}</option>`).join("")}</select></label><span class="pill ${shop.status==="approved"?"approved":""}">${esc(shop.status)}</span>${shop.seller_verified?'<i class="vbd" title="Verified shop">'+VT+"</i>":""}<span style="flex:1"></span><a class="btn s" target="_blank" href="product.html?s=shops&id=${encodeURIComponent(shop.id)}">View shop page</a></div>
 <div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${v}${bd[k]?`<i>${bd[k]}</i>`:""}</button>`).join("")}</div><div id="pn"></div>`}
async function load(){$("#pn").innerHTML='<div class="msg">Loading…</div>';const f=shop.id;
 const [p,o,l,c,ad]=await Promise.all([sb.from("products").select("*").eq("shop_id",f).order("created_at",{ascending:false}),
  sb.from("orders").select("*,order_items(*)").eq("shop_id",f).order("created_at",{ascending:false}).limit(500),
  sb.from("stock_log").select("*").eq("shop_id",f).order("created_at",{ascending:false}).limit(15),
  CAT.length?Promise.resolve({data:CAT}):catQ(),sb.from("ads").select("*").eq("shop_id",String(f)).order("created_at",{ascending:false})]);
 const e=p.error||o.error||l.error;if(e){$("#pn").innerHTML=`<div class="msg">${esc(e.message)}<br>Run the latest supabase-setup.sql in Supabase.</div>`;return}
 P=p.data||[];O=o.data||[];L=l.data||[];AD=ad.error?[]:(ad.data||[]);ADERR=ad.error?ad.error.message:"";if(c.data)CAT=c.data;frame();draw()}
const VT='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px"><path fill="#3897F0" d="M12 1.8l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.1L12 22.2l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.1z"/><path d="M8 12.2l2.6 2.6L16 9.4" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
/* ----- Verification: blue tick criteria, checklist pop-up and application ----- */
async function vCheck(){
 const born=shop.created_at?new Date(shop.created_at):null,lim=new Date();lim.setMonth(lim.getMonth()-1);
 const listed=P.filter(p=>p.status==="approved").length;
 const sold=O.filter(o=>o.status==="delivered").reduce((a,o)=>a+(o.order_items||[]).reduce((b,i)=>b+(+i.quantity||+i.qty||1),0),0);
 let avg=null,n=0;try{const r=await sb.from("shop_reviews").select("rating").eq("shop_id",shop.id).limit(5000);if(!r.error){const x=(r.data||[]).map(z=>+z.rating).filter(z=>z>=1);n=x.length;if(n)avg=x.reduce((t,z)=>t+z,0)/n}}catch(e){}
 if(avg===null){const f=+(shop.rating_avg??shop.rating);if(f>0){avg=f;n=+shop.rating_count||0}}
 return [
  {ok:!!born&&!isNaN(born)&&born<=lim,t:"Your shop has existed for at least 1 month",v:born&&!isNaN(born)?"Opened "+when(shop.created_at):"Opening date unknown"},
  {ok:sold>20,t:"More than 20 products sold",v:sold+" sold so far (delivered orders)"},
  {ok:avg!==null&&avg>=4.5,t:"A rating of 4.5 and above",v:avg===null?"No rating yet":avg.toFixed(1)+" / 5"+(n?" from "+n+" review"+(n===1?"":"s"):"")},
  {ok:listed>=10,t:"At least 10 product listings",v:listed+" approved listing"+(listed===1?"":"s")}]}
function verify(){
 const pending=!!shop.verification_requested_at&&!shop.seller_verified;
 $("#pn").innerHTML=`<div class="pan" style="display:grid;gap:12px"><b style="font-size:18px">Verified badge</b>
  ${shop.seller_verified?`<div style="display:flex;gap:10px;align-items:center;background:#EAF4FF;border:1px solid #cfe3fb;border-radius:12px;padding:12px 14px">${VT}<div><b>Your shop is verified.</b><div class="m">The blue tick shows next to your shop name for shoppers.</div></div></div>`
  :`<p class="m" style="margin:0">Get the blue verified tick next to your shop name, like on Instagram. It tells shoppers they can trust your shop.</p>
   ${shop.verification_reason&&!shop.verified_at?`<div class="msg" style="margin:0"><b>Verification was removed.</b><br>Reason: ${esc(shop.verification_reason)}</div>`:""}
   ${pending?'<div class="msg" style="margin:0">Your application has been sent. The SOKO Smart team will review it and tell you in Messages.</div>':'<div><button class="btn p" id="vOpen" type="button">Add a verified icon</button></div>'}`}</div>`}
async function vOpen(){
 openD('<h3>Verification criteria</h3><p class="m">Checking your shop…</p>');
 const c=await vCheck(),all=c.every(x=>x.ok),done=c.filter(x=>x.ok).length;
 openD(`<h3>${VT} Verification criteria</h3><p class="m" style="margin:0 0 8px">Your shop meets <b>${done} of ${c.length}</b> requirements.</p>
  <div style="border:1px solid var(--bd);border-radius:12px;padding:4px 12px">${c.map((x,i)=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;${i?"border-top:1px solid var(--bd)":""}"><b style="min-width:20px;font-size:18px;color:${x.ok?"#14633F":"#d3261e"}">${x.ok?"✓":"✗"}</b><div><div style="font-weight:600">${esc(x.t)}</div><div class="m">${esc(x.v)}</div></div></div>`).join("")}</div>
  <p class="m" style="margin:10px 0">${all?"Great, your shop meets every requirement. Send your application and the team will review it.":"Meet all the requirements above, then come back to apply."}</p>
  <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" type="button" id="vX">Close</button><button class="btn p" type="button" id="vGo" ${all?"":"disabled"}>Apply for verification</button></div>`)}
document.addEventListener("click",async e=>{
 if(e.target.closest("#vOpen")){vOpen();return}
 if(e.target.closest("#vX")){$("#dlg").close();return}
 const g=e.target.closest("#vGo");if(!g||g.disabled)return;g.disabled=true;
 const {error}=await sb.rpc("request_shop_verification",{p_shop:shop.id});
 if(error){g.disabled=false;toast(/could not find|does not exist|schema cache/i.test(error.message)?"Not set up yet: ask the admin to run supabase-shop-verification.sql.":error.message);return}
 shop.verification_requested_at=new Date().toISOString();$("#dlg").close();toast("Application sent. We will tell you the result in Messages.");frame();draw()});
function plan(){planPanel($("#pn"),shop)}
/* ----- Shop profile: main category, logo, about (the main category is shown on the shop card) ----- */
let SMAINS=[];
async function profile(){const el=$("#pn");el.innerHTML='<p class="m">Loading…</p>';
 try{const r=await sb.from("main_categories").select("id,name").eq("section","shops").order("sort_order").order("name");SMAINS=r.data||[]}catch(e){SMAINS=[]}
 const logo=shop.logo_url||shop.cover_url;
 el.innerHTML=`<div class="pan"><h3 class="sph">Shop profile <span class="pill ${shop.status==="approved"?"approved":""}">${esc(shop.status)}</span>${shop.seller_verified?'<i class="vbd" title="Verified shop">'+VT+"</i>":""}</h3>
  <form id="spf"><div class="spx">
   <div class="spx-l"><span id="spv" style="border:3px solid var(--o);background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;font-weight:800;color:var(--g)">${logo?`<img alt="" src="${esc(logo)}" style="width:100%;height:100%;object-fit:contain">`:esc((shop.name||"S").trim()[0].toUpperCase())}</span><b>${esc(shop.name||"")}</b>
    <label style="width:100%;text-align:left">Change logo<input name="logo" type="file" accept="image/*"></label><span class="m">A square image under 2 MB. Leave empty to keep the current logo.</span></div>
   <div class="spx-r">
    <label>Main category<select name="mc"><option value="">Choose a main category</option>${SMAINS.map(x=>`<option value="${x.id}" ${String(x.id)===String(shop.main_category_id)?"selected":""}>${esc(x.name)}</option>`).join("")}</select><span class="m">${SMAINS.length?"Shown on your shop card. Shoppers find your shop under it.":"The admin has not added any main categories yet."}</span></label>
    <label>About your shop<textarea name="d" rows="6" maxlength="600" placeholder="What you sell, where you deliver, why customers should trust you">${esc(shop.description||"")}</textarea><span class="m">Up to 600 characters.</span></label>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn p" id="spg">Save changes</button><span class="m" id="spm" role="status"></span></div>
   </div></div></form></div>`}
document.addEventListener("change",e=>{const t=e.target;if(t.name!=="logo"||!t.form||t.form.id!=="spf")return;const x=t.files[0],pv=$("#spv");if(!x)return;
 if(!/^image\//.test(x.type)||x.size>2e6){toast("The logo must be an image under 2 MB","error");t.value="";return}
 pv.innerHTML=`<img alt="" src="${URL.createObjectURL(x)}" style="width:100%;height:100%;object-fit:contain">`});
document.addEventListener("submit",async e=>{const f=e.target;if(f.id!=="spf")return;e.preventDefault();
 const go=$("#spg"),msg=$("#spm");go.disabled=true;msg.textContent="Saving…";
 try{let logo=null;const lf=f.logo.files[0];
  /* step 1: upload the picture */
  if(lf){if(!/^image\//.test(lf.type)||lf.size>2e6)throw new Error("The logo must be an image under 2 MB");
   const ext=(lf.name.split(".").pop()||"png").toLowerCase().replace(/[^a-z0-9]/g,"")||"png",path=`${U.id}/shop-logo-${Date.now()}.${ext}`;
   const up=await sb.storage.from("listing-images").upload(path,lf,{contentType:lf.type});
   if(up.error)throw new Error("The picture could not be uploaded: "+up.error.message+(/row-level|policy|permission|unauthor/i.test(up.error.message)?" (storage permission: run supabase-shop-profile-fix.sql)":""));
   logo=sb.storage.from("listing-images").getPublicUrl(path).data.publicUrl}
  const mc=f.mc.value?+f.mc.value:null,about=f.d.value.trim(),id=String(shop.id);
  /* step 2: save with the database function */
  const rp=await sb.rpc("update_my_shop_profile",{p_shop:id,p_main:mc,p_logo:logo,p_about:about});
  /* step 3: check the row really changed; if not, save the fields directly */
  const same=async()=>{const c=await sb.from("shops").select("logo_url,main_category_id,description").eq("id",shop.id).maybeSingle(),d=c.data;
   return !!d&&(!logo||d.logo_url===logo)&&String(d.main_category_id??"")===String(mc??"")&&(d.description||"")===about};
  let ok=!rp.error&&await same(),why=rp.error?rp.error.message:"the database function did not store the new values";
  if(!ok){const upd={main_category_id:mc,description:about};if(logo){upd.logo_url=logo;if(!shop.cover_url||shop.cover_url===shop.logo_url)upd.cover_url=logo}
   let r2;for(let n=0;n<4;n++){r2=await sb.from("shops").update(upd).eq("id",shop.id).eq("owner_id",U.id).select("id");
    const col=r2.error&&((String(r2.error.message).match(/'([a-z_]+)' column|column "?([a-z_]+)"?/i)||[])[1]||(String(r2.error.message).match(/column "?([a-z_]+)"?/i)||[])[1]);
    if(col&&col in upd&&col!=="logo_url"){delete upd[col];continue}break}
   if(r2.error)throw new Error("Could not save the shop profile: "+r2.error.message+" ("+why+"). Run supabase-shop-profile-fix.sql in Supabase.");
   if(!(r2.data||[]).length)throw new Error("The database refused to store the profile ("+why+"). Run supabase-shop-profile-fix.sql in Supabase.")}
  shop.main_category_id=mc;shop.description=about;if(logo){if(!shop.cover_url||shop.cover_url===shop.logo_url)shop.cover_url=logo;shop.logo_url=logo}
  msg.textContent="Saved.";toast("Shop profile saved.");f.logo.value="";profile()}
 catch(x){msg.textContent="";toast(x.message||String(x),"error")}
 go.disabled=false});
function agents(){if(window.ShopAgency)ShopAgency.mount($("#pn"),shop);else $("#pn").innerHTML='<div class="msg">Upload shopagency.js next to this page.</div>'}
function draw(){({overview,orders,products,stock,ads,agents,profile,plan,verify})[tab]()}

function overview(){const since=Date.now()-R*864e5,os=O.filter(o=>new Date(o.created_at)>=since),live=os.filter(o=>o.status!=="cancelled"),rev=live.reduce((a,o)=>a+ +o.total,0);

async function setStatus(id,ns){const o=O.find(x=>x.id===id);if(!o||o.status===ns)return;
 if(ns==="cancelled"&&!await askConfirm({title:"Cancel this order?",msg:"The items go back into your stock. If the buyer already paid, the money held for this order is refunded to their wallet.",ok:"Yes, cancel order",cancel:"Keep order"})){orders();return}
 let error;if(ns==="cancelled"&&o.pay_status==="held"){error=(await sb.rpc("escrow_refund",{p_order:id})).error}else{error=(await sb.from("orders").update({status:ns}).eq("id",id)).error}
 if(error){toast(error.message,"error");orders();return}
 const was=o.status,skipStock=o.pay_status==="held"&&ns==="cancelled";if(!skipStock&&(ns==="cancelled"||was==="cancelled")){const sg=ns==="cancelled"?1:-1;
  for(const i of o.order_items||[]){const p=P.find(x=>String(x.id)===String(i.product_id));if(p)await setStock(p,Math.max(0,(+p.stock||0)+sg*i.qty),sg*i.qty,`Order #${sid(o)} ${ns==="cancelled"?"cancelled":"reopened"}`)}}
 toast("Order marked "+ns);load()}
